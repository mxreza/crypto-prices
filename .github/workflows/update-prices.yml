name: Update Crypto Prices

on:
  schedule:
    # Runs every 15 minutes. Adjust the cron expression to change frequency.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - run: python update_crypto_prices.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
